version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_VERSION_SUFFIX
    # DocumentResolver and LinkResolver are named for what a service must
    # implement, not for what it is. "LinkResolverService" would read as a
    # deployable component; these are contracts that several unrelated services
    # each satisfy, and the shorter name is what the docs and comments use.
    - SERVICE_SUFFIX
breaking:
  use:
    - FILE
