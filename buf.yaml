version: v2
# buf v2 replaces buf.work.yaml with the `modules` list below; a separate
# workspace file is deprecated and buf warns if one is present.
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # PIM, Registry and ModuleExtension are named as the spec names them.
    - SERVICE_SUFFIX
    # FAIL_OPEN / ACTIVE read better on the JSON wire than
    # FAILURE_MODE_FAIL_OPEN. Values stay unique within each package.
    - ENUM_VALUE_PREFIX
breaking:
  use:
    - FILE
