name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.64.0
      - name: make test (includes the no-module-imports boundary check)
        run: make test
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal; exit 1)
      - name: Race detector
        run: go test -race ./internal/...
      - name: make demo (every acceptance criterion, end to end)
        run: make demo
