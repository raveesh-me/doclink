apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: doclink-pg
  namespace: doclink
spec:
  # One instance for laptop headroom. Two is the intended configuration and the
  # manifests are otherwise unchanged by it: services connect to the
  # doclink-pg-rw Service, which CNPG points at whichever pod is primary.
  instances: 1
  # The -minimal image, not the default. The default bundles PostGIS, Python and
  # a barrel of extensions this POC does not use, and costs several hundred MB
  # per node in a kind cluster that is already sharing a laptop's disk.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2-minimal-bookworm

  bootstrap:
    initdb:
      database: doclink
      owner: app
      secret:
        name: doclink-pg-app

  storage:
    size: 2Gi

  # Sized for a laptop. The benchmark is comparing strategies against each
  # other, not establishing absolute throughput, so a small shared_buffers is
  # acceptable as long as every strategy sees the same one.
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "128MB"
      log_min_duration_statement: "500"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  # The migration Job connects as this superuser to create the per-service login
  # roles; no application ever holds these credentials.
  enableSuperuserAccess: true
