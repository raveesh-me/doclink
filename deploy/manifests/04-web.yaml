          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: config
          configMap: { name: subscriptions-web-config }
---
apiVersion: v1
kind: Service
metadata: { name: subscriptions-web, namespace: doclink }
spec:
  selector: { app: subscriptions-web }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-web
  namespace: doclink
spec:
