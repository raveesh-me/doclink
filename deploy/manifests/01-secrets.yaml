# Credentials for the POC. Obviously not how secrets are managed in anger; they
# are checked in here so `make cluster` is one command and there is nothing
# hidden about what the services can reach.
apiVersion: v1
kind: Secret
metadata:
  name: doclink-pg-app
  namespace: doclink
type: kubernetes.io/basic-auth
stringData:
  username: app
  password: doclink-app-dev
---
apiVersion: v1
kind: Secret
metadata:
  name: service-roles
  namespace: doclink
type: Opaque
stringData:
  # One password shared by the five per-service login roles. They are separated
  # by ROLE, not by password: svc_subscriptions cannot read pim.items even
  # knowing every credential in this file.
  password: doclink-role-dev
