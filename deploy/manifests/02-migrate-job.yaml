# Schema migration runs as a Job before any Deployment rolls.
#
# It needs a superuser connection because it creates the per-service login
# roles; splitting it out of the services is what lets those services run with
# the least privilege the design depends on.
apiVersion: batch/v1
kind: Job
metadata:
  name: doclink-migrate
  namespace: doclink
spec:
  backoffLimit: 10
  template:
    metadata:
      labels: { app: doclink-migrate }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          # localhost/ prefix: podman names locally built images that way, and
          # kind loads them under the name they were saved with. Without it,
          # Kubernetes would resolve this to docker.io/doclink/migrate.
          image: localhost/doclink/migrate:dev
          imagePullPolicy: IfNotPresent
          env:
            # The password is passed as PGPASSWORD rather than embedded in the
            # DSN. CNPG generates the superuser password, and a generated
            # password containing '@', '/' or ':' would silently corrupt a URL.
            # pgx reads PGPASSWORD for any field the DSN leaves unset.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: doclink-pg-superuser, key: password }
            - name: MIGRATION_DSN
              value: postgres://postgres@doclink-pg-rw:5432/doclink?sslmode=disable
            - name: SERVICE_ROLE_PASSWORD
              valueFrom:
                secretKeyRef: { name: service-roles, key: password }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
