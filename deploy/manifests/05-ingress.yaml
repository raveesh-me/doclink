# One hostname per component.
#
# This is the manifest that makes the architecture physically true. The shell,
# the two cards, and the four APIs are seven distinct browser origins; the
# browser enforces that the subscriptions card cannot reach into the PIM page's
# DOM, read its variables, or share its cookies, regardless of what the card's
# code tries to do.
#
# *.localhost resolves to 127.0.0.1 in Chrome and Firefox without any DNS setup.
# Safari does not do this; see the README for the /etc/hosts fallback.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: doclink
  namespace: doclink
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-headers: >-
      Content-Type,Connect-Protocol-Version,Connect-Timeout-Ms,Grpc-Timeout,X-Grpc-Web,X-User-Agent
    # ConnectRPC's unary protocol is plain HTTP POST, so no gRPC backend
    # annotation is needed here. That is a real operational advantage of Connect
    # over grpc-web in front of ordinary ingress controllers.
spec:
  ingressClassName: nginx
  rules:
    - host: pim.doclink.localhost
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: pim-web, port: { number: 8080 } } } }
    - host: subs.doclink.localhost
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: subscriptions-web, port: { number: 8080 } } } }
    - host: ship.doclink.localhost
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: shipping-web, port: { number: 8080 } } } }
    - host: doclink-api.doclink.localhost
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: doclink, port: { number: 8080 } } } }
    - host: pim-api.doclink.localhost
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: pim, port: { number: 8081 } } } }
    - host: subs-api.doclink.localhost
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: subscriptions, port: { number: 8082 } } } }
    - host: ship-api.doclink.localhost
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: shipping, port: { number: 8083 } } } }
