# The registry. BENCH_DSN is present only so the MONOLITH baseline can be
# measured in-cluster; remove it and the real design is unaffected.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doclink
  namespace: doclink
spec:
  replicas: 1
  selector:
    matchLabels: { app: doclink }
  template:
    metadata:
      labels: { app: doclink }
    spec:
      containers:
        - name: doclink
          image: localhost/doclink/doclink:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            # PGPASSWORD, not a password inside the DSN: pgx falls back to it
            # for any field the connection string leaves unset, and it keeps
            # credentials out of a string that has URL-escaping rules.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: service-roles, key: password }
            - name: ADDR
              value: ":8080"
            - name: DOCLINK_DSN
              value: "postgres://svc_doclink@doclink-pg-rw:5432/doclink?sslmode=disable"
            - name: DOCLINK_ENDPOINT
              value: "http://doclink:8080"
            - name: BENCH_DSN
              value: "postgres://svc_bench@doclink-pg-rw:5432/doclink?sslmode=disable"
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: doclink
  namespace: doclink
spec:
  selector: { app: doclink }
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
# The anchor service. Its only outbound dependency is the registry, for
# publishing lifecycle events and announcing its own extension point.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pim
  namespace: doclink
spec:
  replicas: 1
  selector:
    matchLabels: { app: pim }
  template:
    metadata:
      labels: { app: pim }
    spec:
      containers:
        - name: pim
          image: localhost/doclink/pim:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            # PGPASSWORD, not a password inside the DSN: pgx falls back to it
            # for any field the connection string leaves unset, and it keeps
            # credentials out of a string that has URL-escaping rules.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: service-roles, key: password }
            - name: ADDR
              value: ":8081"
            - name: PIM_DSN
              value: "postgres://svc_pim@doclink-pg-rw:5432/doclink?sslmode=disable"
            - name: DOCLINK_ENDPOINT
              value: "http://doclink:8080"
            - name: SELF_ENDPOINT
              value: "http://pim:8081"
          readinessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: pim
  namespace: doclink
spec:
  selector: { app: pim }
  ports:
    - port: 8081
      targetPort: 8081
      name: http
---
# A satellite. EMBED_BASE_URL is a browser-facing origin, so it is the
# ingress hostname rather than the in-cluster Service name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscriptions
  namespace: doclink
spec:
  replicas: 1
  selector:
    matchLabels: { app: subscriptions }
  template:
    metadata:
      labels: { app: subscriptions }
    spec:
      containers:
        - name: subscriptions
          image: localhost/doclink/subscriptions:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            # PGPASSWORD, not a password inside the DSN: pgx falls back to it
            # for any field the connection string leaves unset, and it keeps
            # credentials out of a string that has URL-escaping rules.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: service-roles, key: password }
            - name: ADDR
              value: ":8082"
            - name: SUBSCRIPTIONS_DSN
              value: "postgres://svc_subscriptions@doclink-pg-rw:5432/doclink?sslmode=disable"
            - name: DOCLINK_ENDPOINT
              value: "http://doclink:8080"
            - name: SELF_ENDPOINT
              value: "http://subscriptions:8082"
            - name: EMBED_BASE_URL
              value: "http://subs.doclink.localhost:18080"
          readinessProbe:
            httpGet: { path: /healthz, port: 8082 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8082 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: subscriptions
  namespace: doclink
spec:
  selector: { app: subscriptions }
  ports:
    - port: 8082
      targetPort: 8082
      name: http
---
