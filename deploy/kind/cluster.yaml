kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: doclink
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      # Label the node so the ingress controller's nodeSelector matches.
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # 18080 rather than 80: this machine already runs another kind cluster,
      # and a POC should not fight the user's existing environment for ports.
      # The port is part of the origin, so every service URL carries it.
      - containerPort: 80
        hostPort: 18080
        protocol: TCP
      - containerPort: 443
        hostPort: 18443
        protocol: TCP
  # One worker. The intended shape is two, so CNPG can put a primary and a
  # replica on separate nodes and the satellites are not trivially co-located
  # with the registry — but a podman machine with ~3.6 GB of RAM cannot hold
  # three kind nodes plus a replicated Postgres plus another cluster, and a POC
  # that OOMs demonstrates nothing. Add the second worker (and set CNPG
  # instances back to 2) if the machine has the headroom:
  #   podman machine set --memory 8192 --cpus 6
  - role: worker
