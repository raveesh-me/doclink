server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # config.js is mounted from a ConfigMap and must never be cached, or a
    # cluster reconfiguration would not reach browsers that already loaded the
    # app.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Hashed asset filenames, so these are safe to cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The PIM shell is a history-mode SPA: unknown paths must serve index.html
    # so /items/<id> survives a refresh. The embeds have no router and simply
    # 404, which is correct for them.
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
