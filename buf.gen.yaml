version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/raveesh-me/doclink/gen
plugins:
  # Plugin versions are pinned by the `tool` directives in go.mod.
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: gen
    opt: paths=source_relative
