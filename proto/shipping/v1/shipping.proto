syntax = "proto3";

package shipping.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/raveesh-me/doclink/gen/shipping/v1;shippingv1";

message Profile {
  string id = 1;
  string name = 2;
  string carrier = 3;
  int32 handling_days = 4;
  bool requires_signature = 5;
  google.protobuf.Timestamp created_at = 6;
}

// Assignment is shipping's own linkage row to an item.
message Assignment {
  string id = 1;
  string profile_id = 2;
  string anchor_ref = 3;
  int32 weight_grams = 4;
  string dimensions_cm = 5;   // "LxWxH"
  bool hazmat = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ListProfilesRequest {}
message ListProfilesResponse { repeated Profile profiles = 1; }

message GetAssignmentForAnchorRequest { string anchor_ref = 1; }
message GetAssignmentForAnchorResponse {
  // Shipping is many-to-one on the anchor: an item has at most one profile.
  Assignment assignment = 1;
  Profile profile = 2;
  repeated Profile available_profiles = 3;
}

message AssignProfileRequest {
  string anchor_ref = 1;
  string profile_id = 2;
  int32 weight_grams = 3;
  string dimensions_cm = 4;
  bool hazmat = 5;
}
message AssignProfileResponse { Assignment assignment = 1; }

message UnassignProfileRequest { string anchor_ref = 1; }
message UnassignProfileResponse {}

service ShippingService {
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse);
  rpc GetAssignmentForAnchor(GetAssignmentForAnchorRequest) returns (GetAssignmentForAnchorResponse);
  rpc AssignProfile(AssignProfileRequest) returns (AssignProfileResponse);
  rpc UnassignProfile(UnassignProfileRequest) returns (UnassignProfileResponse);
}
