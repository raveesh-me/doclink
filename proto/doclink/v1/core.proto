syntax = "proto3";

package doclink.v1;

option go_package = "github.com/raveesh-me/doclink/gen/doclink/v1;doclinkv1";

// DocRef is the ONLY vocabulary shared across service boundaries.
//
// It is deliberately opaque: it carries identity and nothing else. No schema,
// no fields, no hint about what the document contains. A service that receives
// a DocRef it does not own can do exactly two things with it: store it in its
// own linkage table, or hand it back to the registry for resolution.
//
// Canonical string form is "<namespace>/<type>/<id>", e.g. "pim/item/01J8XYZ".
message DocRef {
  // Owning service's namespace, e.g. "pim", "subscriptions".
  string namespace = 1;
  // Document type within that namespace, e.g. "item", "plan".
  string type = 2;
  // Opaque identifier, unique within (namespace, type).
  string id = 3;
}

// DocSummary is the display projection of a document, produced by its OWNER
// and by no one else. This is how a foreign service renders a reference to a
// document whose schema it cannot see.
message DocSummary {
  DocRef ref = 1;
  string title = 2;
  string subtitle = 3;
  // Small, owner-chosen key/value pairs safe for display. Not a data channel:
  // consumers must not parse these into domain logic.
  map<string, string> badges = 4;
  // Owner-relative deep link, e.g. "/items/01J8XYZ".
  string href = 5;
  // True when the owner could not find the document. Callers use this to
  // detect dangling references without a foreign key.
  bool missing = 6;
}

// Cardinality is declarative metadata only. Nothing enforces it at the storage
// layer, because the two sides live in different databases. It exists so the
// registry can describe a link type and so UIs can pick sane affordances.
enum Cardinality {
  CARDINALITY_UNSPECIFIED = 0;
  CARDINALITY_ONE_TO_ONE = 1;
  CARDINALITY_MANY_TO_ONE = 2;
  CARDINALITY_ONE_TO_MANY = 3;
  CARDINALITY_MANY_TO_MANY = 4;
}

// ResolutionStrategy selects how GetLinks answers. The three strategies are the
// subject of the benchmark; they are otherwise semantically equivalent.
enum ResolutionStrategy {
  // Registry default (federated).
  RESOLUTION_STRATEGY_UNSPECIFIED = 0;
  // Fan out over ConnectRPC to every service that declared a link type
  // anchored on the requested document. Strongly consistent, N network hops.
  RESOLUTION_STRATEGY_FEDERATED = 1;
  // Read a materialized link index inside the registry, maintained by satellite
  // writes. One local query, eventually consistent.
  RESOLUTION_STRATEGY_INDEXED = 2;
  // Straw-man baseline: the anchor's own table carries foreign key columns for
  // every satellite. One join, zero network hops, and a schema change in the
  // anchor service every time a satellite is added.
  RESOLUTION_STRATEGY_MONOLITH = 3;
}
