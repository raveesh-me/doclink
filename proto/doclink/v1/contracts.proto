syntax = "proto3";

package doclink.v1;

import "doclink/v1/core.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/raveesh-me/doclink/gen/doclink/v1;doclinkv1";

// ---------------------------------------------------------------------------
// DocumentResolver: implemented by the service that OWNS a document type.
//
// This is the entire obligation of being an anchor. PIM implements this and is
// then done: it has no knowledge of subscriptions, shipping, or anything that
// arrives later.
// ---------------------------------------------------------------------------

message DescribeRequest { repeated DocRef refs = 1; }
message DescribeResponse { repeated DocSummary summaries = 1; }

service DocumentResolver {
  // Returns exactly one summary per requested ref, in the same order. Callers
  // match by position, so an implementation must never filter out references it
  // cannot find: it returns a summary with missing = true instead.
  rpc Describe(DescribeRequest) returns (DescribeResponse);
}

// ---------------------------------------------------------------------------
// LinkResolver: implemented by every satellite that declares a link type.
//
// The satellite owns the linkage table and answers traversal questions about
// it. The anchor service never sees this interface.
// ---------------------------------------------------------------------------

message ResolveLinksRequest {
  // The anchor to traverse from. This is the ONLY input. In particular there is
  // no tenant hint, no type hint, and no satellite-specific key: if the
  // satellite needs more, it must derive it from its own tables.
  DocRef anchor = 1;
  bool refs_only = 2;
}
message ResolveLinksResponse {
  string predicate = 1;
  Cardinality cardinality = 2;
  repeated DocSummary documents = 3;
}

// LifecycleEvent is emitted by an anchor owner via its outbox and fanned out by
// the registry. It is the replacement for ON DELETE CASCADE across a database
// boundary.
enum LifecycleKind {
  LIFECYCLE_KIND_UNSPECIFIED = 0;
  LIFECYCLE_KIND_CREATED = 1;
  LIFECYCLE_KIND_UPDATED = 2;
  LIFECYCLE_KIND_DELETED = 3;
}

message LifecycleEvent {
  string event_id = 1;
  DocRef subject = 2;
  LifecycleKind kind = 3;
  google.protobuf.Timestamp occurred_at = 4;
  // Monotonic per-subject sequence, so a late delivery can be discarded.
  int64 sequence = 5;
}

message HandleLifecycleRequest { LifecycleEvent event = 1; }
message HandleLifecycleResponse {
  // Number of the satellite's own rows reconciled. Reported for benchmarking
  // orphan cleanup, and to make the handler's effect observable in tests.
  int32 rows_affected = 1;
}

service LinkResolver {
  rpc ResolveLinks(ResolveLinksRequest) returns (ResolveLinksResponse);
  // Idempotent. The registry retries; satellites must tolerate redelivery.
  rpc HandleLifecycle(HandleLifecycleRequest) returns (HandleLifecycleResponse);
}
